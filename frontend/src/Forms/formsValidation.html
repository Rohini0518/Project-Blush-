<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <style>
    div {
      padding: 10px;
    }
  </style>
  <script src="./formvalidation.js" defer></script>
  <body>
    <h2>Forms validation In Html</h2>
    <form onsubmit="handleSubmit(event)">
      <label for="firstNm">First Name: </label>
      <input
        type="text"
        id="firstNm"
        name="firstname"
        placeholder="enter name"
      />
      <div>
        <label for="userage">Age:</label>
        <input type="number" id="userage" name="age" placeholder="enter age" />
      </div>
      <label>Gender:</label>
      <input type="radio" id="female" name="gender" value="female" />Female
      <input type="radio" id="male" name="gender" value="male" />Male
      <div>
        <label>skills:</label>
        <input type="checkbox" name="skills" value="React" />React
        <input type="checkbox" name="skills" value="js" />Js
        <input type="checkbox" name="skills" value="Nodejs" />NodeJS
      </div>
      <button type="submit">Submit</button>
    </form>
    <p id="output">Output:</p>
  </body>
</html>
